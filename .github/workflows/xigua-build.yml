name: Build IPA

# On demand only. An Xcode archive of this project is a ~20 minute job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, one patch ahead of the upstream base (e.g. v3.8.4-xigua.1 for a fork of 3.8.3)"
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install ldid
        run: brew install ldid

      # 版本号写死在 Info.plist 里(项目没有走 MARKETING_VERSION),不盖的话
      # 每次发布都报上游那个号,西瓜IPA助手就永远看不到我们自己的更新。
      #
      # 号要比上游基线**高一个 patch**:助手先比 major.minor.patch,相等时
      # 预发布号一律输给正式号(SemVer 规矩)。所以基于上游 3.8.3 的分支必须
      # 报 3.8.4-xigua.N —— 字面意思就是「3.8.3 之后、3.8.4 之前的一版」,
      # 既是实情,也保证 3.8.4-xigua.2 > 3.8.4-xigua.1 一路递增。
      # 等上游真出了 3.8.4,我们跟进后从 3.8.5-xigua.1 起。
      - name: Stamp version from tag
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-xigua\.[0-9]+$'; then
            echo "::error::tag 要形如 v3.8.4-xigua.1,收到的是 ${{ inputs.tag }}"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION"            Resources/Info.plist
          echo "STAMPED_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本号盖为 $VERSION"

      # entitlements 里的 app group 写的是 Xcode 构建变量
      # $(APP_GROUP_SIDESTORE) / $(APP_GROUP_ALTSTORE)。正常签名时 Xcode 会
      # 展开它们,ldid 不会——它把字面量原样写进二进制。
      #
      # 后果不是签名失败,而是西瓜IPA助手**续签时**失败:它拿应用声明的
      # app group 去 addApplicationGroup.action 注册(还会补上 .<TEAMID>),
      # 苹果对 "$(APP_GROUP_SIDESTORE).TEAMID" 返回 resultCode 35,助手翻译成
      # "The provided app group is invalid."。安装能过是因为电脑端助手用的是
      # 描述文件里的 entitlements,压根不碰这一步。
      #
      # Release 下 DEVELOPMENT_TEAM_SUFFIX 是空的,所以展开成下面两个值——
      # 也正是 LCSharedUtils.appGroupID 运行时要找的那两个(它在后面接
      # .<TEAMID>,和商店注册时补的后缀正好对上)。
      - name: Expand app group variables
        run: |
          SIDESTORE="group.com.SideStore.SideStore"
          ALTSTORE="group.com.rileytestut.AltStore"

          # 上游哪天改了基名,在这里炸,而不是等用户续签失败才发现
          grep -qF "APP_GROUP_SIDESTORE = $SIDESTORE\$(DEVELOPMENT_TEAM_SUFFIX)" xcconfigs/Global.xcconfig \
            || { echo "::error::Global.xcconfig 里的 APP_GROUP_SIDESTORE 变了"; exit 1; }
          grep -qF "APP_GROUP_ALTSTORE = $ALTSTORE\$(DEVELOPMENT_TEAM_SUFFIX)" xcconfigs/Global.xcconfig \
            || { echo "::error::Global.xcconfig 里的 APP_GROUP_ALTSTORE 变了"; exit 1; }

          for f in entitlements.xml \
                   LaunchAppExtension/LaunchAppExtension.entitlements \
                   LiveProcess/LiveProcess.entitlements \
                   ShareExtension/ShareExtension.entitlements; do
            sed -i '' -e "s|\$(APP_GROUP_SIDESTORE)|$SIDESTORE|g" \
                      -e "s|\$(APP_GROUP_ALTSTORE)|$ALTSTORE|g" "$f"
            if grep -q 'APP_GROUP_' "$f"; then
              echo "::error::$f 里还有没展开的 app group 变量"; exit 1
            fi
            echo "展开: $f"
          done

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -archivePath ./XiguaLC \
            -configuration Release \
            -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # CODE_SIGNING_ALLOWED=NO also drops the entitlements, and the store's
      # signer only keeps entitlements the app already declares (AltSign filters
      # the profile's set against the app's). Ship them unsigned-but-present via
      # ldid or the installed app loses its keychain groups and app group — the
      # "import certificate" step then silently does nothing.
      - name: Fakesign with entitlements
        run: |
          APP=XiguaLC.xcarchive/Products/Applications/LiveContainer.app
          ldid -S"entitlements.xml" "$APP/LiveContainer"
          ldid -S"LaunchAppExtension/LaunchAppExtension.entitlements" "$APP/PlugIns/LaunchAppExtension.appex/LaunchAppExtension"
          ldid -S"LiveProcess/LiveProcess.entitlements"               "$APP/PlugIns/LiveProcess.appex/LiveProcess"
          ldid -S"ShareExtension/ShareExtension.entitlements"         "$APP/PlugIns/ShareExtension.appex/ShareExtension"

      # Mirrors upstream's build_github.sh: SideStore.framework is only part of
      # the combined LiveContainer+SideStore build, which we don't ship — our
      # store installs this app itself.
      - name: Package IPA
        run: |
          mv XiguaLC.xcarchive/Products/Applications Payload
          rm -rf Payload/LiveContainer.app/Frameworks/SideStore.framework
          zip -qr XiguaLiveContainer.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          ls -lh XiguaLiveContainer.ipa

      # A bundle identifier change would break the desktop helper's
      # LiveContainer special-case (it keys on this exact string to inject the
      # com.kdt.livecontainer.shared keychain groups), so fail loudly if a merge
      # from upstream ever moves it.
      - name: Verify identity
        run: |
          APP=Payload/LiveContainer.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "bundle id: $BUNDLE_ID"
          echo "display name: $NAME"
          echo "version: $VERSION"
          [ "$BUNDLE_ID" = "com.kdt.livecontainer" ] || { echo "::error::bundle id changed"; exit 1; }
          [ "$NAME" = "西瓜多开" ] || { echo "::error::display name is not 西瓜多开"; exit 1; }
          # 打包用的是归档产物,不是源码树 —— 确认盖的号真的进了包里。
          [ "$VERSION" = "$STAMPED_VERSION" ] \
            || { echo "::error::包里的版本是 $VERSION,应为 $STAMPED_VERSION"; exit 1; }
          # ldid, not codesign: codesign can't read back an ldid-written blob.
          ENTS=$(ldid -e "$APP/LiveContainer" 2>/dev/null)
          printf '%s' "$ENTS" | grep -q "keychain-access-groups" \
            || { echo "::error::entitlements missing — fakesign step did not take"; exit 1; }
          # 没展开的 app group 会让助手续签时报 "The provided app group is
          # invalid."(苹果 resultCode 35),而安装那一步照样成功——所以只能
          # 在这里拦,不然要等到用户点更新才暴露。
          if printf '%s' "$ENTS" | grep -q 'APP_GROUP_'; then
            echo "::error::包里还有没展开的 app group 变量"; exit 1
          fi
          printf '%s' "$ENTS" | grep -q "group.com.SideStore.SideStore" \
            || { echo "::error::包里没有 group.com.SideStore.SideStore"; exit 1; }
          echo "OK"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" XiguaLiveContainer.ipa --clobber
          else
            gh release create "$TAG" XiguaLiveContainer.ipa \
              --title "西瓜多开 $TAG" \
              --notes "未签名的 ad-hoc 包，需用侧载工具以你自己的 Apple ID 签名后安装。" \
              $FLAGS
          fi

          SIZE=$(stat -f%z XiguaLiveContainer.ipa)
          echo "### 已发布 \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`size\`: **$SIZE** — 更新 apps.json 时要用这个值。" >> $GITHUB_STEP_SUMMARY
